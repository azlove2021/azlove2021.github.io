  function go(id) {
    current = id;
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('page-title').textContent = (ROUTES.find(r => r.id === id) || {}).label || '工作台';
    renderNav();
    const bc = document.getElementById('breadcrumb');
    if (bc) {
      const trail = ['工作台'];
      const cr = (ROUTES.find(r => r.id === id) || {}).crumb;
      if (Array.isArray(cr)) cr.forEach(x => trail.push(x));
      bc.innerHTML = trail.map((t, i) => {
        const isLast = i === trail.length - 1;
        if (i === 0) return '<a href="#" data-bc="home">' + Util.escape(t) + '</a>';
        const rm = ROUTES.find(r => r.label === t);
        if (rm && !isLast) return '<a href="#" data-bc="' + rm.id + '">' + Util.escape(t) + '</a>';
        return '<span class="cur">' + Util.escape(t) + '</span>';
      }).join('<span class="sep">›</span>');
      bc.querySelectorAll('[data-bc]').forEach(a => a.onclick = (e) => { e.preventDefault(); go(a.dataset.bc); });
    }
    const c = document.getElementById('content');
    // 进入日历路由时重置为电脑当前月（打开即显示今天所在月；翻月浏览不受影响）

  /* ===================== 9b. 成绩分析辅助函数 ===================== */
  function numOr(v) { const n = Util.num(v); return n == null ? '' : n; }
  const _statsCache = new Map(); // exam.id -> { fp, val }
  function statsFingerprint(exam) {
    const arr = exam.students || [];
    let h = arr.length + '|';
    for (let i = 0; i < arr.length; i++) { const e = arr[i]; h += (e.number || '') + ':' + (Util.num(e.total) != null ? Util.num(e.total) : Util.sumSubjects(e)) + ':' + SUBJECTS.slice(0, 6).map(s => Util.num(e[s.k])).join(',') + ';'; }
    return h;
  }
  function classStats(exam) {
    if (exam && exam.id) {
      const fp = statsFingerprint(exam);
      const hit = _statsCache.get(exam.id);
      if (hit && hit.fp === fp) return hit.val;
    }
    const entries = exam.students || [];
    const val = SUBJECTS.map(s => {
      const vals = entries.map(e => Util.num(e[s.k])).filter(v => v != null);
      if (!vals.length) return { l: s.l, avg: '-', max: '-', min: '-', exc: '-', pass: '-' };
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      const max = Math.max(...vals), min = Math.min(...vals);
      const exc = vals.filter(v => v >= 90).length, pass = vals.filter(v => v >= 60).length;
      return { l: s.l, avg: avg.toFixed(1), max, min, exc: ((exc / vals.length) * 100).toFixed(0) + '%', pass: ((pass / vals.length) * 100).toFixed(0) + '%' };
    });
    if (exam && exam.id) _statsCache.set(exam.id, { fp: statsFingerprint(exam), val });
    return val;
  }
  function classStatsSheet(exam) { const rows = [['学科', '平均分', '最高分', '最低分', '优秀率', '及格率']]; classStats(exam).forEach(st => rows.push([st.l, st.avg, st.max, st.min, st.exc, st.pass])); return rows; }
  // 班级概览指标（建议5）：平均总分 / 优秀率 / 及格率（总分按满分折算百分比）
  function examMetrics(exam) {
    const tot = (exam.students || []).map(e => Util.num(e.total) || Util.sumSubjects(e)).filter(v => v != null);
    if (!tot.length) return null;
    const full = CONFIG.subjectFull.total || 750, T = CONFIG.thresholds;
    const avg = tot.reduce((a, b) => a + b, 0) / tot.length;
    const excR = tot.filter(v => v / full >= T.excPct).length / tot.length;
    const passR = tot.filter(v => v / full >= T.passPct).length / tot.length;
    return { avg: avg, excR: excR, passR: passR, n: tot.length };
  }
  function sheetRaw(exam) {
    const rk = examRanks(exam);
    const rows = [['姓名', '学号', '语文', '数学', '英语', '物理', '化学', '生物', '总分', '班级排名']];
    exam.students.slice().sort((a, b) => (Util.num(b.total) || Util.sumSubjects(b)) - (Util.num(a.total) || Util.sumSubjects(a))).forEach(e => {
      const ta = Util.num(e.total) != null ? Util.num(e.total) : Util.sumSubjects(e);
      rows.push([e.name, e.number, numOr(e.chinese), numOr(e.math), numOr(e.english), numOr(e.physics), numOr(e.chemistry), numOr(e.biology), numOr(ta), rk.total[nameKey(e)] || '']);
    });
    return { name: exam.name + '·原始', rows };
  }
  function sheetSubj(exam) {
    const rows = [['学科', '姓名', '学号', '分数', '学科排名']];
    SUBJECTS.slice(0, 6).forEach(s => {
      exam.students.slice().sort((a, b) => (Util.num(b[s.k]) || 0) - (Util.num(a[s.k]) || 0)).forEach((e, i) => rows.push([s.l, e.name, e.number, numOr(e[s.k]), i + 1]));
    });
    return { name: exam.name + '·学科排名', rows };
  }
  function sheetBio(exam) { return sheetSubjectAnalysis(exam, 'biology'); }
  function sheetSubjectAnalysis(exam, subjKey) {
    const sub = SUBJECTS.find(s => s.k === subjKey) || { k: subjKey, l: '科目' };
    const rk = examRanks(exam);
    const vals = (exam.students || []).map(e => Util.num(e[subjKey])).filter(v => v != null);
    const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : '-';
    const rows = [['姓名', '学号', sub.l, sub.l + '排名', '班级' + sub.l + '均分']];
    exam.students.slice().sort((a, b) => (Util.num(b[subjKey]) || 0) - (Util.num(a[subjKey]) || 0)).forEach(e => rows.push([e.name, e.number, numOr(e[subjKey]), rk.subj[subjKey] ? (rk.subj[subjKey][nameKey(e)] || '') : '', avg]));
    return { name: exam.name + '·' + sub.l, rows };
  }
  function sheetProgress(a, b) {
    const keyOf = e => e.sid || ('n' + (e.number || '')) || ('x' + e.name);
    const bmap = {}; (b.students || []).forEach(e => bmap[keyOf(e)] = e);
    const ra = examRanks(a), rb = examRanks(b);
    const rows = [['姓名', '学号', 'A总分', 'B总分', '进退步', 'A排名', 'B排名', '排名变化']];
    a.students.forEach(e => {
      const be = bmap[keyOf(e)]; if (!be) return;
      const ta = Util.num(e.total) || Util.sumSubjects(e), tb = Util.num(be.total) || Util.sumSubjects(be);
      const ra0 = ra.total[nameKey(e)], rb0 = rb.total[nameKey(be)];
      rows.push([e.name, e.number, numOr(ta), numOr(tb), (tb - ta), ra0 || '', rb0 || '', (ra0 && rb0) ? (ra0 - rb0) : '']);
    });
    return { name: a.name + '→' + b.name + '·进退步', rows };
  }
  // 具体化成绩总结：结合各科首末变化、强弱科、波动，生成可读的针对该生的建议
  function autoSuggest(series) {
    if (!series || series.length === 0) return '暂无成绩记录，无法生成总结。';
    const t = getTrend(series);
    const last = series[series.length - 1]; const first = series[0];
    const subs = SUBJECTS.slice(0, 6);
    // 各科 首→末 分数变化与趋势
    const subChanges = subs.map(su => {
      const f = Util.num(first.values[su.k]), l = Util.num(last.values[su.k]);
      if (f == null || l == null) return null;
      return { k: su.k, l: su.l, d: l - f, sign: l > f ? 'up' : l < f ? 'down' : 'flat' };
    }).filter(Boolean);
    const upSubs = subChanges.filter(x => x.sign === 'up').sort((a, b) => b.d - a.d);
    const downSubs = subChanges.filter(x => x.sign === 'down').sort((a, b) => a.d - b.d);
    // 强弱科：按最近一次各科得分率（得分/满分）
    const scoreRate = subs.map(su => { const v = Util.num(last.values[su.k]); const full = CONFIG.subjectFull[su.k] || 100; return { l: su.l, r: v == null ? -1 : v / full }; });
    const strong = scoreRate.filter(x => x.r >= 0).sort((a, b) => b.r - a.r)[0];
    const weak = scoreRate.filter(x => x.r >= 0).sort((a, b) => a.r - b.r)[0];
    // 波动（相邻考试总分标准差近似）
    const totals = series.map(s => s.total);
    let vol = 0; for (let i = 1; i < totals.length; i++) vol += Math.abs(totals[i] - totals[i - 1]); vol = totals.length > 1 ? (vol / (totals.length - 1)).toFixed(1) : 0;
    const parts = [];
    // 一、总体趋势（带数据）
    if (t.dir === 'up') parts.push('成绩整体提升：最近一次总分 ' + last.total + '，较首次 ' + first.total + ' 提高 ' + (last.total - first.total) + ' 分。');
    else if (t.dir === 'down') parts.push('成绩整体下滑：最近一次总分 ' + last.total + '，较首次 ' + first.total + ' 下降 ' + (first.total - last.total) + ' 分，需重点关注。');
    else parts.push('成绩总体平稳：最近一次总分 ' + last.total + '（排名 ' + last.rank + '/' + last.totalCount + '）。');
    // 二、科目亮点 / 短板
    if (upSubs.length) parts.push('提升明显：' + upSubs.slice(0, 2).map(x => x.l + '↑' + x.d).join('、') + '。');
    if (downSubs.length) parts.push('需加强：' + downSubs.slice(0, 2).map(x => x.l + '↓' + Math.abs(x.d)).join('、') + '。');
    // 三、强科 / 弱科
    if (strong && weak && strong.l !== weak.l) parts.push('优势学科「' + strong.l + '」（得分率' + Math.round(strong.r * 100) + '%），薄弱学科「' + weak.l + '」（得分率' + Math.round(weak.r * 100) + '%）。');
    else if (strong) parts.push('各科均衡，其中「' + strong.l + '」相对突出（得分率' + Math.round(strong.r * 100) + '%）。');
    // 四、波动与建议
    if (Number(vol) > 25) parts.push('成绩波动较大（相邻考试总分区均 ' + vol + ' 分），建议稳定做题节奏、减少失误。');
    else parts.push('成绩稳定性较好，建议在强科上适当拔高、短板科目针对性补练。');
    return parts.join('\n');
  }

      tabs.forEach(t => html += '<button class="act ' + (this._view === t[0] ? 'pink' : 'ghost') + '" data-ev="' + t[0] + '" style="white-space:nowrap;flex-shrink:0">' + t[1] + '</button>');

    // 分数段分布：按选中考试×科目，5 档梯度（参考 73%/67%/60%/53% 边界）展示人数与百分比
    _range(c) {
      const s = Store.get();
      if (!s.exams.length) { c.innerHTML = '<div class="card"><div class="empty">暂无考试，请先到「导入成绩」添加</div></div>'; return; }
      const subs = SUBJECTS.map(x => x.k);
      const sortedEx = s.exams.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const exSel = s._rangeExamId && sortedEx.find(e => e.id === s._rangeExamId) ? s._rangeExamId : sortedEx[0].id;
      const subSel = s._rangeSub && subs.indexOf(s._rangeSub) >= 0 ? s._rangeSub : subs[0];
      let html = '<div class="card"><h3>📶 分数段分布</h3>';
      html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center">';
      html += '<label class="fld" style="margin:0">考试：</label><select class="in" id="rng-ex" style="width:auto">';
      sortedEx.forEach(e => { html += '<option value="' + e.id + '"' + (e.id === exSel ? ' selected' : '') + '>' + Util.escape(e.name) + '</option>'; });
      html += '</select>';
      html += '<label class="fld" style="margin:0">科目：</label><select class="in" id="rng-sub" style="width:auto">';
      SUBJECTS.forEach(x => { html += '<option value="' + x.k + '"' + (x.k === subSel ? ' selected' : '') + '>' + Util.escape(x.l) + '</option>'; });
      html += '</select></div>';
      const exam = s.exams.find(e => e.id === exSel);
      const full = CONFIG.subjectFull[subSel] || 100;
      const scores = (exam.students || []).map(st => Util.num(st.values ? st.values[subSel] : st[subSel])).filter(v => v != null);
      const total = scores.length;
      const hi = Math.round(full * 0.733), mid2 = Math.round(full * 0.667), mid1 = Math.round(full * 0.6), lo = Math.round(full * 0.533);
      const ranges = [
        { key: 'excellent', label: (hi + 1) + '-' + full + '（优秀）', min: hi + 1, max: full, cls: 'excellent' },
        { key: 'good', label: (mid2 + 1) + '-' + hi + '（良好）', min: mid2 + 1, max: hi, cls: 'good' },
        { key: 'mid', label: (mid1 + 1) + '-' + mid2 + '（中等）', min: mid1 + 1, max: mid2, cls: 'mid' },
        { key: 'pass', label: (lo + 1) + '-' + mid1 + '（及格）', min: lo + 1, max: mid1, cls: 'pass' },
        { key: 'weak', label: lo + '分以下（待提升）', min: 0, max: lo, cls: 'weak' }
      ];
      ranges.forEach(r => { r.count = scores.filter(v => v >= r.min && v <= r.max).length; });
      const maxC = Math.max.apply(null, ranges.map(r => r.count)) || 1;
      html += '<div class="range-list">';
      ranges.forEach(r => {
        const pct = total ? Math.round(r.count / total * 100) : 0;
        const w = Math.round(r.count / maxC * 100);
        html += '<div class="range-row"><div class="range-label">' + r.label + '</div><div class="range-track"><div class="range-fill ' + r.cls + '" style="width:' + w + '%">' + (r.count > 0 ? r.count : '') + '</div></div><div class="range-count"><em>' + r.count + '</em>人（' + pct + '%）</div></div>';
      });
      html += '</div>';
      html += '<div class="tip" style="margin-top:10px">共 <b>' + total + '</b> 人参考 · 满分 <b>' + full + '</b> · 分段边界按 73%/67%/60%/53% 自动换算（参考样式可按需调整）</div>';
      html += '</div>';
      c.innerHTML = html;
      c.querySelector('#rng-ex').onchange = e => { Store.update(st => { st._rangeExamId = e.target.value; }); this.render(document.getElementById('content')); };
      c.querySelector('#rng-sub').onchange = e => { Store.update(st => { st._rangeSub = e.target.value; }); this.render(document.getElementById('content')); };

        try {
          const sheets = await XLSXEngine.parseFile(file);

          const res = parseExamImport(rows);
          return { name: file.name, file, res, ok: !!res.ok };

  function studentSummary(sid) {
    const s = Store.get(); const g = s.biologyGrowth[sid]; const st = studentById(sid);
    if (!st) return '暂无档案。';
    const parts = ['📋 ' + st.name + ' 同学 全科成长总结：'];
    const series = studentSeries(sid, st.name, st.number);
    // 有成绩 → 复用 autoSuggest 的具体化成绩分析
    if (series.length) {
      parts.push('【成绩】');
      parts.push(autoSuggest(series));
    } else {
      parts.push('【成绩】暂无考试成绩记录，请先在「成绩分析-导入成绩」补充。');
    }
    // 档案类数据
    if (g && g.knowledge) { const weak = Object.keys(g.knowledge).filter(k => (g.knowledge[k].mastery || 5) <= 2); if (weak.length) parts.push('【知识模块】薄弱点：' + weak.map(w => w.replace('·', '·')).join('、') + '，建议针对性巩固。'); }
    if (g && g.mistakes && g.mistakes.length) { const topics = g.mistakes.map(m => m.topic).filter(Boolean); parts.push('【错题】累计 ' + g.mistakes.length + ' 条' + (topics.length ? '，多集中在：' + topics.slice(0, 3).join('、') : '') + '，建议定期回顾。'); }
    if (g && g.experiments && g.experiments.length) parts.push('【实验】完成实验能力评价 ' + g.experiments.length + ' 次。');
    if (g && g.note) parts.push('【教师观察】' + g.note);
    return parts.join('\n');
  }

  function exportAllBioReports() {
    const s = Store.get();
    if (!s.students.length) { UI.toast('暂无学生，无法导出', 'err'); return; }
    refreshBioTopicKeys();
    const mods = (Array.isArray(s.biologyModules) && s.biologyModules.length) ? s.biologyModules : BIO_MODULES_DEFAULT;
    const allTopics = []; mods.forEach(m => m.topics.forEach(t => allTopics.push(m.book + '·' + t)));
    const classInfo = s.classInfo || {};
    const today = Util.today();
    const masteryLabels = ['未掌握', '薄弱', '一般', '良好', '精通'];
    // 准备每位学生报表 HTML
    const pageHtml = s.students.map(st => {
      const g = s.biologyGrowth[st.id] || { knowledge: {}, note: '' };
      const k = g.knowledge || {};
      let rows = '';
      allTopics.forEach(t => {
        const rec = k[t] || { mastery: 0 };
        const m = Math.max(0, Math.min(5, Number(rec.mastery) || 0));
        const lvl = masteryLabels[m - 1] || '—';
        const color = m >= 4 ? '#7fc8a9' : m === 3 ? '#9bb7e0' : m === 2 ? '#f2b56b' : m === 1 ? '#e8859a' : '#cfd6df';
        rows += '<tr><td>' + Util.escape(t.split('·')[0]) + '</td><td>' + Util.escape(t.split('·')[1] || '') + '</td>' +
          '<td style="text-align:center"><span style="display:inline-block;padding:3px 10px;border-radius:10px;background:' + color + ';color:#fff;font-weight:700">' + (m || '-') + '</span></td>' +
          '<td style="text-align:center">' + lvl + '</td>' +
          '<td>' + Util.escape(rec.weak || '') + '</td>' +
          '<td>' + Util.escape(rec.note || '') + '</td></tr>';
      });
      // 各模块小计
      const modSummary = mods.map(m => {
        let cnt = [0, 0, 0, 0, 0]; // 各掌握度人数
        m.topics.forEach(t => { const rec = k[m.book + '·' + t]; const v = Math.max(0, Math.min(5, Number(rec && rec.mastery) || 0)); cnt[v]++; });
        const mastered = cnt[3] + cnt[4]; // 良好+精通

      }).join('');

        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;border-bottom:2px solid ' + (m => m)('var(--accent)' || '#e58fb0') + ';padding-bottom:6px">' +
          '<div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e58fb0,#7aa7d6);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700">' + Util.escape((st.name || '').slice(-2)) + '</div>' +
          '<div><div style="font-size:18px;font-weight:800">' + Util.escape(st.name || '') + '</div><div style="color:#666;font-size:12px">' + Util.escape(classInfo.className || '') + ' · ' + Util.escape(st.number || '无学号') + '</div></div>' +
          '<div style="margin-left:auto;color:#666;font-size:12px">打印日期：' + today + '</div>' +
        '</div>' +
        '<div style="margin:6px 0 10px"><b>各模块掌握情况（良好以上 / 总章节）</b><div style="margin-top:4px">' + modSummary + '</div></div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f7e9f0"><th style="border:1px solid #ddd;padding:6px;text-align:left">书本</th><th style="border:1px solid #ddd;padding:6px;text-align:left">章节</th><th style="border:1px solid #ddd;padding:6px">掌握度</th><th style="border:1px solid #ddd;padding:6px">评级</th><th style="border:1px solid #ddd;padding:6px;text-align:left">薄弱点</th><th style="border:1px solid #ddd;padding:6px;text-align:left">教师备注</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div style="margin-top:10px;padding:8px;background:#fdf0f6;border-radius:6px;font-size:12px"><b>教师总体观察：</b>' + Util.escape(g.note || '（无）') + '</div>' +
        '</div>';
    }).join('');
    const fullHtml = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>知识模块掌握情况报表 - ' + Util.escape(classInfo.className || '') + '</title>' +
      '<style>body{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;margin:14mm;color:#333}h1{margin:0 0 6px;font-size:18px;color:#e58fb0}.meta{color:#666;font-size:12px;margin-bottom:14px}.pcard{border:1px solid #ccc;border-radius:8px;padding:14px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}@media print{ @page{size:A4;margin:14mm} body{margin:0}}</style>' +
      '</head><body>' +
      '<h1>📚 知识模块掌握情况报表</h1>' +
      '<div class="meta">' + Util.escape(classInfo.className || '班级未命名') + ' · ' + Util.escape(classInfo.grade || '') + ' · 班主任：' + Util.escape(classInfo.headTeacher || '-') + ' · 共 ' + s.students.length + ' 名学生 · ' + allTopics.length + ' 个章节 · 打印日期：' + today + '</div>' +

  // 课表单元格配色：按课程名归类到一组马卡龙色，便于快速识读
  const SUBJ_COLOR = function (c) {
    const palette = [['语文', '#e58fb0'], ['数学', '#7aa7d6'], ['英语', '#6ab07b'], ['物理', '#9bb7e0'], ['化学', '#7fc8a9'], ['生物', '#9c8fc9'], ['政治', '#e0a840'], ['历史', '#c98ab0'], ['地理', '#5a9aa8'], ['体育', '#f2b56b'], ['信息', '#8ba3c9'], ['心理', '#a8b8d0']];
    const hit = palette.find(p => (c || '').indexOf(p[0]) >= 0);
    return hit ? hit[1] : '#a8b0c0';
  };
  // 课表合并计算：仅做同列（纵向）连续相同课程/自由格的 rowspan 合并；不做跨天横向合并（避免午休/晚餐等大格子无法单独编辑）
  const computeScheduleMerges = function (sc) {
    const days = sc.days, periods = sc.periods, cells = sc.cells;
    const N = days.length, M = periods.length;
    const typeOf = pi => (periods[pi] && periods[pi].type) || 'am';
    const isFreeCell = (di, pi) => {
      const cell = (cells[di] && cells[di][pi]) || { c: '', t: '', free: false };
      return !!(cell.free || ['break', 'lunch', 'dinner'].includes(typeOf(pi)) || !cell.c);
    };
    const keyOf = (di, pi) => {
      const cell = (cells[di] && cells[di][pi]) || { c: '', t: '', free: false };
      return (cell.c || '') + '|' + (isFreeCell(di, pi) ? 'F' : 'C');
    };
    const span = [], hide = [];
    for (let di = 0; di < N; di++) { span[di] = []; hide[di] = []; let pi = 0; while (pi < M) { const k = keyOf(di, pi); let cnt = 1; while (pi + cnt < M && keyOf(di, pi + cnt) === k) cnt++; span[di][pi] = cnt; for (let j = 1; j < cnt; j++) hide[di][pi + j] = true; pi += cnt; } }
    return { N, M, periods, span, hide, isFreeCell, keyOf };
  };
  // 课程单元格内容（含合并后的时间跨度提示）
  const scheduleCellHTML = function (cell, mg, di, pi) {
    const periods = mg.periods;
    const col = SUBJ_COLOR(cell.c);
    const rs = mg.span[di][pi] || 1;
    let hint = '';
    if (rs > 1 && periods[pi] && periods[pi + rs - 1]) {
      const t0 = (periods[pi].time || '').split('-')[0];
      const t1 = (periods[pi + rs - 1].time || '').split('-')[1] || (periods[pi + rs - 1].time || '');
      hint = '<div class="tip" style="margin:0">🕒 ' + Util.escape((t0 + (t1 ? '–' + t1 : ''))) + ' · 共' + rs + '节</div>';
    } else if (cell.t) {
      hint = '<div class="tip" style="margin:0">' + Util.escape(cell.t) + '</div>';
    }
    return '<div class="sch-subj" style="border-left:3px solid ' + col + '"><b style="color:' + col + '">' + Util.escape(cell.c) + '</b>' + hint + '</div>';
  };

        win.document.close(); win.focus(); setTimeout(() => { try { win.print(); } catch (e) {} }, 300);
      } else UI.toast('浏览器拦截了弹出窗口，请允许后重试', 'err');

    // 模板：一键套用 / 恢复默认
    _templates(c) {
      const list = SCHEDULE_TEMPLATES.map((t, i) =>

        '<div style="font-weight:600">' + Util.escape(t.name) + '</div>' +
        '<div class="tip" style="margin-top:4px">' + Util.escape(t.desc) + '</div></div>').join('');
      const body = '<div class="m-body" style="max-width:480px">' +
        '<h3 style="margin:0 0 10px">📋 课表模板</h3>' +
        '<div class="tip" style="margin-bottom:10px">选择一个模板一键套用（会覆盖当前课表，建议先「导出Excel」备份）。</div>' +

        '</div>';
      const m = UI.openModal(body, { wide: false });
      m.querySelectorAll('[data-tpl]').forEach(el => el.onclick = async () => {
        const t = SCHEDULE_TEMPLATES[+el.dataset.tpl];
        if (!(await UI.confirm('套用模板「' + t.name + '」？将覆盖当前课表。', false))) return;

      });
      m.querySelector('#tpl-reset').onclick = async () => {
        if (!(await UI.confirm('恢复为默认课表（中山烟洲高三）？将覆盖当前课表。', false))) return;
        Store.update(st => { st.schedule = JSON.parse(JSON.stringify(Store.defaultSchedule)); });
        UI.closeModal(m); UI.toast('已恢复默认课表', 'ok'); this.render(c);
      };
      m.querySelector('#tpl-cancel').onclick = () => UI.closeModal(m);
    },
    // 导出 Excel（与导入互转）
    _exportExcel(c) {
      const sc = Store.get().schedule; if (!sc) { UI.toast('暂无课表', 'err'); return; }
      const header = ['节次', '时间', '类型'].concat(sc.days);
      const rows = [header];
      sc.periods.forEach((p, pi) => {
        const row = [p.name, p.time, p.type || 'am'];
        sc.days.forEach((d, di) => {
          const cell = (sc.cells[di] && sc.cells[di][pi]) || {};
          row.push((cell.c || '') + (cell.t ? ('（' + cell.t + '）') : ''));
        });
        rows.push(row);
      });
      XLSXEngine.download([{ name: (sc.meta.name || '课表').slice(0, 28), rows }], (sc.meta.name || '课表') + '.xlsx');
      UI.toast('已导出 Excel', 'ok');
    },
    // 导入 Excel（识别本工具导出的课表格式，自动转置行列）
    _importExcel(c) {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.xlsx,.xls,.csv';
      input.style.display = 'none';
      document.body.appendChild(input);
      input.onchange = async () => {
        const file = input.files && input.files[0]; if (!file) return;
        if (UI.showLoading) UI.showLoading('正在解析…');
        try {
          const sheets = await XLSXEngine.parseFile(file);
          const sh = sheets && sheets[0];
          if (!sh || !sh.rows || sh.rows.length < 2) { UI.toast('Excel 无数据或格式不正确', 'err'); return; }
          const rows = sh.rows;
          const header = rows[0].map(x => String(x == null ? '' : x).trim());
          const days = header.slice(3).filter(Boolean);
          if (days.length < 1) { UI.toast('未识别到星期列，请用本工具导出的课表格式（首行：节次/时间/类型/星期…）', 'err'); return; }
          const periods = [], periodRows = [];
          for (let ri = 1; ri < rows.length; ri++) {
            const r = rows[ri];
            const pname = String(r[0] == null ? '' : r[0]).trim();
            const ptime = String(r[1] == null ? '' : r[1]).trim();
            if (!pname) continue;
            const ptypeRaw = (r.length > 2 && String(r[2] == null ? '' : r[2]).trim()) || '';
            const type = ptypeRaw || (/大课间/.test(pname) ? 'break' : (/午休/.test(pname) ? 'lunch' : (/晚餐/.test(pname) ? 'dinner' : (/早读/.test(pname) ? 'morning' : (/晚自习/.test(pname) ? 'evening' : 'am')))));
            periods.push({ no: periods.length + 1, name: pname, time: ptime, type });
            const rowCells = [];
            for (let ci = 3; ci < r.length; ci++) {
              const raw = String(r[ci] == null ? '' : r[ci]).trim();
              let cc = '', tt = ''; const mm = raw.match(/^(.*?)（(.*)）$/);
              if (mm) { cc = mm[1].trim(); tt = mm[2].trim(); } else { cc = raw; }
              const isFree = !cc || ['休息', '大课间', '午休', '晚餐', '课外活动', '社团活动', '自由'].indexOf(cc) >= 0 || ['break', 'lunch', 'dinner'].indexOf(type) >= 0;
              const cell = { c: cc, t: tt }; if (isFree) cell.free = true; // 仅对真正空闲格写 free，保持与默认课表紧凑结构一致，保证导入导出往返一致
              rowCells.push(cell);
            }
            periodRows.push(rowCells);
          }
          if (!periods.length) { UI.toast('未识别到节次', 'err'); return; }
          // 转置：periodRows[pi][di] -> cells[di][pi]
          const cells = [];
          for (let di = 0; di < days.length; di++) { cells[di] = []; for (let pi = 0; pi < periods.length; pi++) { cells[di][pi] = periodRows[pi][di] || { c: '', t: '' }; } }
          const cur = Store.get().schedule || {};
          const meta = cur.meta || { name: '', school: '', grade: '', term: '' };
          Store.update(st => { st.schedule = { meta: Object.assign({}, meta), days: days.slice(), periods, cells }; });
          UI.toast('已导入课表（' + days.length + '天 × ' + periods.length + '节）', 'ok'); this.render(c);
        } catch (e) { UI.toast('导入失败：' + (e && e.message ? e.message : e), 'err'); }
        finally { if (UI.hideLoading) UI.hideLoading(); }
      };
      input.click();
    }
  };

          { label: '取消', value: 'cancel', cls: 'ghost' }

        if (choice === 'cancel') { UI.closeModal(m); return; }
        if (choice === 'cover') Store.replaceNormalized(inc);
        else Store.update(st => { const merged = Sync.mergeState(st, inc); Object.keys(merged).forEach(k => st[k] = merged[k]); });

    const m = UI.openModal('🔄 数据同步码', body, '<button class="act ghost" data-x="close">关闭</button>');
    m.querySelector('#sy-gen').onclick = () => {
      try { const code = Util.utf8ToB64(JSON.stringify(s)); m.querySelector('#sy-code').value = code; m.querySelector('#sy-code').select(); UI.toast('已生成，可复制', 'ok'); }
      catch (err) { UI.toast('生成失败', 'err'); }
    };
    m.querySelector('#sy-imp').onclick = async () => {
      const code = m.querySelector('#sy-code').value.trim(); if (!code) { UI.toast('请粘贴同步码', 'err'); return; }
      try {
        let inc; try { inc = JSON.parse(Util.b64ToUtf8(code)); } catch (e1) { throw new Error('格式错误'); }
        if (!inc || typeof inc !== 'object' || inc.version == null) throw new Error('数据损坏');
        if (inc.version > 1) throw new Error('版本不兼容');
        const choice = await UI.choose('导入方式', '同步码解析成功，请选择导入方式：', [
          { label: '覆盖当前数据', value: 'cover', cls: 'danger' },
          { label: '合并到当前数据', value: 'merge', cls: 'pink' },
          { label: '取消', value: 'cancel', cls: 'ghost' }
        ]);
        if (choice === 'cancel') return;
        if (choice === 'cover') Store.replaceNormalized(inc);
        else Store.update(st => { const merged = Sync.mergeState(st, inc); Object.keys(merged).forEach(k => st[k] = merged[k]); });
        UI.toast('同步完成', 'ok'); UI.closeModal(m); render();
      } catch (err) { UI.toast('导入失败：' + err.message, 'err'); }
    };
    m.querySelector('[data-x="close"]').onclick = () => UI.closeModal(m);
  }

      const body = '<div class="grid two"><div><label class="fld">日期</label><input class="in" id="hw-date" type="date" value="' + Util.today() + '"></div><div><label class="fld">科目</label><select class="in" id="hw-sub">' + subOpts + '</select></div></div>' +
        '<label class="fld">未交学生（可多选）</label><div style="max-height:200px;overflow-y:auto;padding:6px;background:var(--panel2);border-radius:6px">' + stuOpts + '</div>';
      const m = UI.openModal('登记作业未交', body, '<button class="act ghost" data-x="close">取消</button><button class="act pink" data-x="save">保存</button>');
      m.querySelector('[data-x="close"]').onclick = () => UI.closeModal(m);
      m.querySelector('[data-x="save"]').onclick = () => {
        const date = m.querySelector('#hw-date').value; const subject = m.querySelector('#hw-sub').value;
        const missing = [].slice.call(m.querySelectorAll('.hw-miss-cb:checked')).map(x => x.value);
        Store.update(st => { if (!st.homeworkCheck) st.homeworkCheck = { subjects: [], records: [] }; if (!Array.isArray(st.homeworkCheck.records)) st.homeworkCheck.records = []; st.homeworkCheck.records.push({ id: 'hw' + Date.now(), date, subject, missing }); });
        UI.closeModal(m); this.render(c); UI.toast('已登记', 'ok');
      };
    },
    _editSubjects(c) {
      const s = Store.get();
      const hw = s.homeworkCheck || { subjects: [] };
      const body = '<label class="fld">科目列表（每行一个：科目|收交时间|负责人）</label><textarea class="in" id="hw-subs" rows="8" style="font-family:ui-monospace,Consolas,monospace">' + hw.subjects.map(su => su.subject + '|' + (su.time || '') + '|' + (su.manager || '')).join('\n') + '</textarea><div class="tip" style="margin-top:6px">格式：语文|早读前|张三。修改后点保存。</div>';
      const m = UI.openModal('编辑科目', body, '<button class="act ghost" data-x="close">取消</button><button class="act pink" data-x="save">保存</button>');
      m.querySelector('[data-x="close"]').onclick = () => UI.closeModal(m);
      m.querySelector('[data-x="save"]').onclick = () => {
        const lines = m.querySelector('#hw-subs').value.split('\n').map(x => x.trim()).filter(Boolean);
        const subjects = lines.map(line => { const p = line.split('|'); return { subject: (p[0] || '').trim(), time: (p[1] || '').trim(), manager: (p[2] || '').trim() }; }).filter(x => x.subject);
        Store.update(st => { if (!st.homeworkCheck) st.homeworkCheck = { subjects: [], records: [] }; st.homeworkCheck.subjects = subjects; });
        UI.closeModal(m); this.render(c); UI.toast('已保存', 'ok');
      };
    },
    _stats(c) {
      const s = Store.get();
      const hw = s.homeworkCheck || { records: [] };
      const now = new Date(); const dow = now.getDay() || 7; const monday = new Date(now); monday.setDate(now.getDate() - dow + 1); monday.setHours(0, 0, 0, 0);
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23, 59, 59, 999);
      const cnt = {};
      hw.records.filter(r => { const d = new Date(r.date); return d >= monday && d <= sunday; }).forEach(r => (r.missing || []).forEach(sid => cnt[sid] = (cnt[sid] || 0) + 1));
      const rows = Object.keys(cnt).map(sid => ({ sid, name: (s.students.find(x => x.id === sid) || {}).name || '?', count: cnt[sid] })).sort((a, b) => b.count - a.count);
      let body = '<div class="tip">本周（' + Util.fmtDate(monday) + ' ~ ' + Util.fmtDate(sunday) + '）未交作业学生统计</div>';
      if (!rows.length) body += '<div class="empty">本周暂无未交记录</div>';
      else {
        body += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>学生</th><th>未交次数</th><th>处理建议</th></tr></thead><tbody>';
        rows.forEach(r => { body += '<tr><td><b>' + Util.escape(r.name) + '</b></td><td><b style="color:' + (r.count >= 3 ? '#D9534F' : 'var(--accent-2)') + '">' + r.count + '</b></td><td>' + (r.count >= 3 ? '⚠️ 连续 ≥3 次，约谈家长' : '跟进提醒') + '</td></tr>'; });
        body += '</tbody></table></div>';
      }
      const m = UI.openModal('📊 学生未交统计', body, '<button class="act pink" data-x="close">关闭</button>');
      m.querySelector('[data-x="close"]').onclick = () => UI.closeModal(m);
    }
  };

  /* ===================== 模块：家长联系方式 ===================== */
  ModuleMap.parentContact = {
    maskPhone(p) {
      if (!p) return '';
      const s = String(p).trim();
      if (s.length < 7) return s;
      return s.slice(0, 3) + '****' + s.slice(-4);
    },
    render(c) {
      const s = Store.get();
      const students = s.students || [];
      let html = '<div class="card"><h3>📞 家长联系方式</h3>';
      html += '<div class="tip">家校沟通联络表 · 信息仅限班主任使用 · 电话自动脱敏显示</div>';
      html += '<div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap"><input class="in" id="pc-q" placeholder="搜索姓名/学号/电话…" style="max-width:220px"><button class="act sm ghost" id="pc-export">📤 导出 CSV</button></div>';
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>学号</th><th>学生姓名</th><th>父亲姓名</th><th>父亲电话</th><th>母亲姓名</th><th>母亲电话</th><th>家庭住址</th><th>操作</th></tr></thead><tbody>';
      const q = (s._pcQuery || '').toLowerCase();
      const filtered = students.filter(st => !q || (st.name || '').toLowerCase().indexOf(q) >= 0 || (st.number || '').toLowerCase().indexOf(q) >= 0 || (st.fatherPhone || '').indexOf(q) >= 0 || (st.motherPhone || '').indexOf(q) >= 0);
      if (!filtered.length) html += '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">' + (students.length ? '无匹配学生' : '暂无学生，请先在「学生信息」添加') + '</td></tr>';
      filtered.forEach(st => {
        const missing = !st.fatherName && !st.fatherPhone && !st.motherName && !st.motherPhone && !st.address;
        html += '<tr><td>' + Util.escape(st.number || '-') + '</td><td><b>' + Util.escape(st.name || '-') + '</b></td>';
        html += '<td>' + (st.fatherName ? Util.escape(st.fatherName) : '<span class="pc-miss">未填</span>') + '</td>';
        html += '<td>' + (st.fatherPhone ? '<span class="pc-phone">' + Util.escape(this.maskPhone(st.fatherPhone)) + '</span>' : '<span class="pc-miss">未填</span>') + '</td>';
        html += '<td>' + (st.motherName ? Util.escape(st.motherName) : '<span class="pc-miss">未填</span>') + '</td>';
        html += '<td>' + (st.motherPhone ? '<span class="pc-phone">' + Util.escape(this.maskPhone(st.motherPhone)) + '</span>' : '<span class="pc-miss">未填</span>') + '</td>';
        html += '<td>' + (st.address ? Util.escape(st.address) : '<span class="pc-miss">未填</span>') + '</td>';
        html += '<td class="act-cell"><button class="act sm ghost" data-ed="' + st.id + '">编辑</button></td></tr>';
      });
      html += '</tbody></table></div>';
      if (filtered.some(x => !x.fatherName && !x.fatherPhone && !x.motherName && !x.motherPhone && !x.address)) html += '<div class="tip" style="margin-top:8px;color:#D9534F">⚠ 有 ' + filtered.filter(x => !x.fatherName && !x.fatherPhone && !x.motherName && !x.motherPhone && !x.address).length + ' 名学生家长信息缺失，请尽快补全</div>';
      html += '</div>';
      c.innerHTML = html;
      c.querySelector('#pc-q').value = s._pcQuery || '';
      c.querySelector('#pc-q').oninput = (e) => { Store.update(st => { st._pcQuery = e.target.value; }); this.render(c); };
      c.querySelector('#pc-export').onclick = () => this._exportCsv(filtered);
      c.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => this._edit(c, b.dataset.ed));
    },
    _edit(c, sid) {
      const s = Store.get();
      const st = s.students.find(x => x.id === sid); if (!st) return;
      const body = '<div class="grid two"><div><label class="fld">父亲姓名</label><input class="in" id="pc-fn" value="' + Util.escape(st.fatherName || '') + '"></div><div><label class="fld">父亲电话</label><input class="in" id="pc-fp" value="' + Util.escape(st.fatherPhone || '') + '" placeholder="11 位手机号"></div></div>' +
        '<div class="grid two"><div><label class="fld">母亲姓名</label><input class="in" id="pc-mn" value="' + Util.escape(st.motherName || '') + '"></div><div><label class="fld">母亲电话</label><input class="in" id="pc-mp" value="' + Util.escape(st.motherPhone || '') + '" placeholder="11 位手机号"></div></div>' +
        '<label class="fld">家庭住址</label><input class="in" id="pc-addr" value="' + Util.escape(st.address || '') + '" placeholder="如 小店区学府街">';
      const m = UI.openModal('编辑家长信息：' + Util.escape(st.name), body, '<button class="act ghost" data-x="close">取消</button><button class="act pink" data-x="save">保存</button>');
      m.querySelector('[data-x="close"]').onclick = () => UI.closeModal(m);
      m.querySelector('[data-x="save"]').onclick = () => {
        const upd = { fatherName: m.querySelector('#pc-fn').value.trim(), fatherPhone: m.querySelector('#pc-fp').value.trim(), motherName: m.querySelector('#pc-mn').value.trim(), motherPhone: m.querySelector('#pc-mp').value.trim(), address: m.querySelector('#pc-addr').value.trim() };
        Store.update(st => { const x = st.students.find(y => y.id === sid); if (x) Object.assign(x, upd); });
        UI.closeModal(m); this.render(c); UI.toast('已保存', 'ok');
      };
    },
    _exportCsv(rows) {
      const header = ['学号', '学生姓名', '父亲姓名', '父亲电话', '母亲姓名', '母亲电话', '家庭住址'];
      const lines = [header.join(',')];
      rows.forEach(st => lines.push([st.number || '', st.name || '', st.fatherName || '', st.fatherPhone || '', st.motherName || '', st.motherPhone || '', (st.address || '').replace(/,/g, '，')].map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')));
      const csv = '\ufeff' + lines.join('\n'); // BOM 让 Excel 识别 UTF-8
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '家长联系方式_' + Util.today() + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      UI.toast('已导出 CSV', 'ok');
    }
  };

  /* ===================== 11. 启动 ===================== */
  // 首次启动欢迎 + 备份提醒：本地数据存于浏览器，清除缓存会丢失，提示定期导出 JSON
  function showFirstRun() {
    const SEEN = 'wb_firstrun_v1';
    let seen = false;
    try { seen = localStorage.getItem(SEEN) === '1'; } catch (e) {}
    if (seen) return;
    const body = '<div style="line-height:1.85">' +
      '<p>👋 欢迎使用 <b>高中班主任工作台</b>（各科班主任通用版）。本工具面向<b>单班级</b>使用，所有数据都保存在<b>当前浏览器本地</b>。</p>' +
      '<p>⚠️ <b>重要提醒：</b>浏览器清除缓存 / 重装 / 换设备都会导致本地数据丢失。请养成<b>定期导出 JSON 备份</b>的习惯（顶部「备份」按钮），亦可生成同步码在多设备间迁移。</p>' +
      '<p>📌 小提示：导入成绩时若学生姓名+学号齐全，会自动补全到学生名单，无需重复录入。</p>' +
      '</div>';
    const m = UI.openModal('欢迎使用 · 数据备份须知', body,
      '<button class="act ghost" data-r="0">我知道了</button><button class="act pink" data-r="1">立即导出 JSON 备份</button>');
    m.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      if (b.dataset.r === '1') { UI.closeModal(m); try { openBackup && openBackup(); } catch (e) {} }
      else UI.closeModal(m);
      try { localStorage.setItem(SEEN, '1'); } catch (e) {}
    });
  }
  // 主题切换：在 body 上挂主题类，刷新下拉「当前」高亮，持久化到 localStorage
  // 主题列表：粉色(默认)、蓝色、绿色、白色、黑色 + 晴川(蓝青#79BEDF)、岫烟(青绿#00B7C7)、缃云(暖黄#F4DC84)
  const THEMES = ['pink', 'blue', 'green', 'white', 'dark', 'qingchuan', 'xiuyan', 'xiangyun'];
  function applyTheme(name) {
    name = THEMES.indexOf(name) >= 0 ? name : 'pink';
    document.body.classList.remove('theme-blue', 'theme-green', 'theme-white', 'theme-dark', 'theme-qingchuan', 'theme-xiuyan', 'theme-xiangyun');
    if (name !== 'pink') document.body.classList.add('theme-' + name);
    const menu = document.getElementById('theme-menu');
    if (menu) menu.querySelectorAll('button[data-theme]').forEach(b => b.classList.toggle('on', b.dataset.theme === name));
    try { localStorage.setItem('wb_theme', name); } catch (e) {}
  }
  function bootstrap() {
    Store.load();
    // 先恢复主题，再渲染（避免主题类切换导致闪烁）
    let savedTheme = 'pink'; try { savedTheme = localStorage.getItem('wb_theme') || 'pink'; } catch (e) {}
    applyTheme(savedTheme);
    renderNav();
    document.getElementById('hamburger').onclick = () => document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('btn-class').onclick = openClassSettings;
    document.getElementById('btn-backup').onclick = openBackup;
    document.getElementById('btn-sync').onclick = openSync;
    // 主题下拉
    const ts = document.getElementById('theme-switch');
    document.getElementById('btn-theme').onclick = (e) => { e.stopPropagation(); ts.classList.toggle('open'); };
    document.getElementById('theme-menu').querySelectorAll('button[data-theme]').forEach(b => b.onclick = (e) => { e.stopPropagation(); applyTheme(b.dataset.theme); ts.classList.remove('open'); });
    document.addEventListener('click', () => ts.classList.remove('open'));
    render();

    // 页脚展示版本信息（建议4：版本可追溯）
    const foot = document.getElementById('app-footer');
    if (foot) foot.textContent = '高中班主任工作台 v' + APP_VERSION + ' · 构建 ' + (BUILD_TIME || '').slice(0, 10) + ' · 数据保存在本机浏览器';
    // 全局异常捕获并写入诊断日志（建议4：诊断日志）
    window.addEventListener('error', (ev) => { try { Logger.error('uncaught', ev.error || ev.message); } catch (e) {} });
    window.addEventListener('unhandledrejection', (ev) => { try { Logger.error('unhandledrejection', ev.reason); } catch (e) {} });
    // 增量持久化：页面卸载/隐藏时强制落盘，杜绝合并写入窗口内丢数据（建议3）
    const _flush = () => { try { Store.flush(); } catch (e) {} };
    window.addEventListener('pagehide', _flush);
    window.addEventListener('beforeunload', _flush);
    if (document.addEventListener) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') _flush(); });
    showFirstRun();
  }
  function openClassSettings() {
    const s = Store.get();
    const ci = s.classInfo || {};
    const body = '<div class="grid two">' +
      '<div><label class="fld">班级名称</label><input class="in" id="ci-name" value="' + Util.escape(ci.className || '') + '"></div>' +
      '<div><label class="fld">年级</label><input class="in" id="ci-grade" value="' + Util.escape(ci.grade || '') + '"></div>' +
      '<div><label class="fld">班主任</label><input class="in" id="ci-ht" value="' + Util.escape(ci.headTeacher || '') + '"></div>' +
      '<div><label class="fld">学期</label><input class="in" id="ci-sem" value="' + Util.escape(ci.semester || '') + '"></div></div>' +
      '<label class="fld">班级格言/口号</label><input class="in" id="ci-motto" value="' + Util.escape(ci.motto || '') + '">' +
      '<label class="fld">班级目标（心愿瓶）</label><textarea class="in" id="ci-cg">' + Util.escape((ci.wish && ci.wish.classGoal) || '') + '</textarea>' +
      '<label class="fld">教师寄语（心愿瓶）</label><textarea class="in" id="ci-tw">' + Util.escape((ci.wish && ci.wish.teacherWords) || '') + '</textarea>' +
      '<hr style="border:none;border-top:1px dashed var(--line);margin:16px 0">';
    const m = UI.openModal('⚙️ 班级设置', body, '<button class="act ghost" data-x="close">取消</button><button class="act pink" data-x="save">保存</button>');
    m.querySelector('[data-x="close"]').onclick = () => UI.closeModal(m);
    m.querySelector('[data-x="save"]').onclick = () => {
      Store.update(st => {
        st.classInfo = st.classInfo || {};
        st.classInfo.className = m.querySelector('#ci-name').value;
        st.classInfo.grade = m.querySelector('#ci-grade').value;
        st.classInfo.headTeacher = m.querySelector('#ci-ht').value;
        st.classInfo.semester = m.querySelector('#ci-sem').value;
        st.classInfo.motto = m.querySelector('#ci-motto').value;
        st.classInfo.wish = st.classInfo.wish || {};
        st.classInfo.wish.classGoal = m.querySelector('#ci-cg').value;
        st.classInfo.wish.teacherWords = m.querySelector('#ci-tw').value;
      });
      UI.toast('已保存班级信息', 'ok'); UI.closeModal(m); render();
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();

  // 暴露给全局便于调试
  window.App = { Store, Sync, Util, UI, go, CONFIG, Logger, APP_VERSION, BUILD_TIME, examRanks, classStats, studentSeries, toLunar, holidayOf, XLSXEngine, parseExamImport, matchStudent, lineChart, bindAllLineTips, zoomLineChart, ModuleMap };
})();


</script>
</body>
</html>
