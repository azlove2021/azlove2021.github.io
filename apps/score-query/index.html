<script>

   查分系统 · 应用逻辑

(function () {
  'use strict';

  /* ---------------- 数据装载 ---------------- */
  var PAYLOAD = (window.__STUDENTS__ && typeof window.__STUDENTS__ === 'object') ? window.__STUDENTS__ : {};

  var RAW = Array.isArray(PAYLOAD.students) ? PAYLOAD.students : [];

  function s(v) {
    if (v === null || v === undefined) return '';

    if (typeof v === 'number') return isFinite(v) ? String(v).replace(/\.0+$/, '') : '';
    return String(v).trim();
  }

  var DATA = RAW.map(function (r, i) {

      i: i,
      name: s(r.name),
      grade: s(r.grade),
      klass: s(r.klass),
      account: s(r.account),
      examNo: s(r.examNo),
      score: (r.score === 0 || r.score) ? s(r.score) : '',
      total: (r.total === 0 || r.total) ? s(r.total) : ''
    };
    rec.classFull = (rec.grade + rec.klass) || '—';
    rec._n = {
      name: normalize(rec.name),
      account: normalize(rec.account),
      examNo: normalize(rec.examNo),

    };

  }).filter(function (r) { return r.name; });

  /* ---------------- 工具 ---------------- */
  // 全角转半角 + 去空白 + 小写，兼容中文输入法下打出的全角数字
  function normalize(x) {
    return String(x === null || x === undefined ? '' : x)
      .replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })

  function el(id) { return document.getElementById(id); }

  // 编辑距离（用于"您是不是要找"）
  function lev(a, b) {
    a = String(a); b = String(b);
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1), i, j;
    for (j = 0; j <= n; j++) prev[j] = j;

          prev[j] + 1,
          cur[j - 1] + 1,

  /* ---------------- 检索 ---------------- */
  // 优先级：姓名完全匹配 > 姓名前缀 > 姓名包含 > 账号完全 > 账号包含 > 考号完全 > 考号包含
  function search(q) {
    var nq = normalize(q).trim();
    if (!nq) return [];
    var out = [];
    for (var i = 0; i < DATA.length; i++) {
      var r = DATA[i], p = -1;
      var n = r._n, L = nq.length;

      if (n.name === nq) p = 0;
      else if (n.name.indexOf(nq) === 0) p = 1;
      else if (n.name.indexOf(nq) > -1) p = 2;
      else if (n.account && n.account === nq) p = 3;
      else if (n.account && n.account.indexOf(nq) > -1) p = 4;
      else if (n.examNo && n.examNo === nq) p = 5;
      else if (n.examNo && n.examNo.indexOf(nq) > -1) p = 6;
      if (p < 0) continue;

      // 同名次内：姓名越短越靠前，其次按原顺序
      out.push({ r: r, p: p, len: r._n.name.length });
    }
    out.sort(function (a, b) {
      return (a.p - b.p) || (a.len - b.len) || (a.r.i - b.r.i);

  // 未命中时给出近似姓名

      else if (nq.length >= 3 && nm.slice(-1) === nq.slice(-1)) d = 2;      // 同名尾字

    }

    for (i = 0; i < scored.length && out.length < (limit || 6); i++) {

  var ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';

  }

  function renderEmptyIdle() {

  function initTheme() {

  /* ---------------- 初始化 ---------------- */

    }
    el('subtitle').textContent = (META.classes && META.classes[0] ? META.classes[0] + ' · ' : '') + '姓名 / 账号 / 考号 查询';

    // 输入即搜（轻量防抖，保证中文输入法组词时也实时反馈）
    var timer = null;
    qEl.addEventListener('input', function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(render, 90);
    });
    qEl.addEventListener('focus', function () { searchCard.classList.add('is-focus'); });
    qEl.addEventListener('blur', function () { searchCard.classList.remove('is-focus'); });
    qEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (timer) clearTimeout(timer);
        render();
        var list = search(qEl.value);
        if (list.length === 1) {
          copyText(list[0].account).then(function () {
            toast('已复制 ' + list[0].name + ' 的账号', 'ok');
          }, function () { toast('复制失败，请手动选中复制', 'err'); });
        } else if (!list.length && normalize(qEl.value).trim()) {
          toast('没有找到对应学生', 'err');
        }
      } else if (e.key === 'Escape') {
        qEl.value = '';
        render();
        qEl.blur();
      }
    });

    clearBtn.addEventListener('click', function () {
      qEl.value = '';
      render();
      qEl.focus();
    });

    // 隐私模式切换
    el('privacyBtn').addEventListener('click', function () { applyPrivacy(!PRIVACY); });
    applyPrivacy(false);

    // 事件委托：复制 / 重新查询 / 揭示提示
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || typeof t.closest !== 'function') return;

      var chip = t.closest('.chip[data-name]');
      if (chip) {
        qEl.value = chip.getAttribute('data-name');
        qEl.focus();
        render();
        return;
      }

      var rv = t.closest('[data-reveal]');
      if (rv) {
        toast('隐私模式已开启，关闭后可复制', 'err');
        return;
      }

      var btn = t.closest('.copy-btn[data-copy]');
      if (!btn) return;
      var val = btn.getAttribute('data-copy');
      var label = btn.getAttribute('data-label') || '';
      var labelSpan = btn.querySelector('.bt');
      var original = labelSpan ? labelSpan.textContent : '复制';
      copyText(val).then(function () {
        toast('已复制' + (label ? ' ' + label : '') + '：' + val, 'ok');
        if (labelSpan) {
          btn.classList.add('done');
          labelSpan.textContent = '已复制';
          setTimeout(function () {
            btn.classList.remove('done');
            labelSpan.textContent = original;
          }, 1400);
        }
      }, function () {
        toast('复制失败，请手动选中复制', 'err');
      });
    });

    render();
    qEl.focus();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露给自动化测试
  window.App = {
    data: DATA,
    meta: META,
    search: search,
    suggest: suggest,
    mask: mask,
    normalize: normalize,
    render: render,
    version: '1.0.0'
  };
})();

</script>
</body>
</html>
