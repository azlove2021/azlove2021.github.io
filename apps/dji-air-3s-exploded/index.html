<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DJI Air 3S · 三维结构拆解可视化</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23081018'/%3E%3Cpath d='M6 16h20M16 6v20' stroke='%2335e0ff' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root{
    --accent:#35e0ff;
    --accent-soft:rgba(53,224,255,.16);
    --line:rgba(53,224,255,.15);
    --text:#d7e5ef;
    --muted:#7c909f;
    --panel:rgba(9,15,21,.78);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04070b;color:var(--text);
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block}
  .label-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse 82% 76% at 50% 44%,rgba(0,0,0,0) 48%,rgba(2,5,9,.24) 80%,rgba(2,5,9,.5) 100%)}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;z-index:200;background:#04070b;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s ease}
  #boot.gone{opacity:0;pointer-events:none}
  .boot-ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(53,224,255,.16);
    border-top-color:var(--accent);animation:spin 1.1s linear infinite;position:relative}
  .boot-ring::after{content:"";position:absolute;inset:9px;border-radius:50%;
    border:1px solid rgba(53,224,255,.1);border-bottom-color:rgba(53,224,255,.6);animation:spin 1.7s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .boot-title{font-family:var(--mono);font-size:12px;letter-spacing:.42em;color:#9fd8e8;text-indent:.42em}
  #bootMsg{font-size:11px;color:#5d7a8b;letter-spacing:.08em;max-width:80vw;text-align:center;line-height:1.9}
  .boot-bar{width:190px;height:2px;background:rgba(53,224,255,.12);overflow:hidden}
  .boot-bar i{display:block;height:100%;width:36%;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}

  /* ---------- top bar ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;height:82px;z-index:20;display:flex;
    align-items:center;justify-content:space-between;padding:0 26px;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,7,11,.94),rgba(4,7,11,.55) 55%,rgba(4,7,11,0))}
  .topbar>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:13px}
  .brand-mark{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em;color:#eaf9ff;
    border:1px solid rgba(53,224,255,.5);padding:7px 9px;border-radius:2px;background:rgba(53,224,255,.07);
    box-shadow:0 0 22px rgba(53,224,255,.14),inset 0 0 14px rgba(53,224,255,.06)}
  .brand-txt h1{font-size:17px;font-weight:600;letter-spacing:.26em;color:#f2fbff;line-height:1.1}
  .brand-txt span{display:block;font-size:10px;letter-spacing:.18em;color:#5f7b8c;margin-top:4px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .actions button{font-family:inherit;font-size:11.5px;letter-spacing:.08em;color:#a3bccb;cursor:pointer;
    padding:8px 13px;border-radius:2px;border:1px solid rgba(53,224,255,.18);background:rgba(10,18,25,.66);
    backdrop-filter:blur(10px);transition:.2s ease;white-space:nowrap}
  .actions button:hover{color:#e8fcff;border-color:rgba(53,224,255,.55);box-shadow:0 0 20px rgba(53,224,255,.16)}
  .actions button.on{color:#c9f6ff;border-color:rgba(53,224,255,.7);background:rgba(53,224,255,.13);
    box-shadow:0 0 22px rgba(53,224,255,.2),inset 0 0 16px rgba(53,224,255,.08)}

  /* ---------- panels ---------- */
  .panel{position:fixed;z-index:15;width:252px;border-radius:3px;overflow:hidden;
    background:linear-gradient(158deg,rgba(11,19,27,.86),rgba(5,9,14,.74));
    border:1px solid var(--line);backdrop-filter:blur(16px) saturate(125%);
    box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045)}
  .panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none}
  .panel::before{top:-1px;left:-1px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);opacity:.75}
  .panel::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent);opacity:.75}
  .p-head{display:flex;align-items:baseline;justify-content:space-between;
    padding:14px 15px 11px;border-bottom:1px solid rgba(53,224,255,.1)}
  .p-head span{font-size:12.5px;letter-spacing:.14em;color:#d6ecf5}
  .p-head em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#4d6a7b}

  .panel-left{top:96px;left:26px}
  #partList{list-style:none;padding:6px 7px 8px;max-height:calc(100vh - 250px);overflow-y:auto}
  #partList::-webkit-scrollbar{width:3px}
  #partList::-webkit-scrollbar-thumb{background:rgba(53,224,255,.25)}
  #partList li{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:2px;cursor:pointer;
    border-left:2px solid transparent;transition:.16s ease}
  #partList li:hover{background:rgba(53,224,255,.06)}
  #partList li.active{background:linear-gradient(90deg,rgba(53,224,255,.14),rgba(53,224,255,.02));
    border-left-color:var(--accent)}
  #partList li .idx{font-family:var(--mono);font-size:9.5px;color:#4a6274;width:16px;flex:0 0 16px;transition:.16s}
  #partList li.active .idx,#partList li:hover .idx{color:var(--accent)}
  #partList li .nm{font-size:12px;color:#c2d5e1;letter-spacing:.04em;transition:.16s;display:block}
  #partList li.active .nm{color:#f0fdff}
  #partList li .en{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.11em;color:#4f6778;margin-top:3px}
  .panel-foot{padding:9px 15px 12px;border-top:1px solid rgba(53,224,255,.08);
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#44606f;display:flex;justify-content:space-between}

  .panel-right{top:96px;right:26px;width:302px;max-height:calc(100vh - 150px);display:flex;flex-direction:column}
  .p-body{padding:14px 15px 16px;overflow-y:auto}
  .p-body::-webkit-scrollbar{width:3px}
  .p-body::-webkit-scrollbar-thumb{background:rgba(53,224,255,.25)}

  .d-top{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px}
  .d-index{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid rgba(53,224,255,.35);
    padding:4px 5px;border-radius:2px;line-height:1;background:rgba(53,224,255,.07)}
  .d-top h2{font-size:15.5px;font-weight:600;letter-spacing:.08em;color:#f0fbff;line-height:1.25}
  .d-en{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#557081;margin-top:5px}
  .d-desc{font-size:11.5px;line-height:1.85;color:#8ba3b3;letter-spacing:.02em;
    padding-bottom:12px;border-bottom:1px dashed rgba(53,224,255,.13)}
  .d-specs{display:flex;flex-direction:column;gap:1px;margin:12px 0 15px}
  .spec-row{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;padding:5.5px 0;
    border-bottom:1px solid rgba(255,255,255,.035)}
  .spec-row span{color:#5f7b8c;letter-spacing:.04em;flex:0 0 auto}
  .spec-row b{color:#cbe3ef;font-weight:500;text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.02em}
  .d-btn{width:100%;padding:10px;font-family:inherit;font-size:11.5px;letter-spacing:.12em;cursor:pointer;
    color:#bff4ff;background:rgba(53,224,255,.1);border:1px solid rgba(53,224,255,.4);border-radius:2px;transition:.2s}
  .d-btn:hover{background:rgba(53,224,255,.2);box-shadow:0 0 24px rgba(53,224,255,.22);color:#fff}

  .overview{padding:2px 0}
  .ov-lead{font-size:11.5px;line-height:1.9;color:#8ba3b3;padding-bottom:12px;
    border-bottom:1px dashed rgba(53,224,255,.13)}
  .ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .ov-cell{padding:9px 10px;background:rgba(53,224,255,.045);border:1px solid rgba(53,224,255,.1);border-radius:2px}
  .ov-cell b{display:block;font-family:var(--mono);font-size:13px;color:#dff8ff;font-weight:500;letter-spacing:.03em}
  .ov-cell span{display:block;font-size:9px;color:#5d7b8c;margin-top:4px;letter-spacing:.08em}
  .ov-tip{margin-top:14px;font-size:10.5px;color:#54707f;line-height:1.9;letter-spacing:.03em}
  .ov-tip em{font-style:normal;color:var(--accent)}

  /* ---------- hint ---------- */
  .hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:15;display:flex;
    align-items:center;gap:16px;padding:8px 16px;border-radius:40px;border:1px solid rgba(53,224,255,.13);
    background:rgba(7,12,18,.68);backdrop-filter:blur(12px);transition:opacity .8s ease;white-space:nowrap}
  .hint.dim{opacity:.28}
  .hint-mobile{display:none}
  .hint .h-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#6d8798;letter-spacing:.06em}
  .hint kbd{font-family:var(--mono);font-size:9px;color:#a9c6d6;border:1px solid rgba(53,224,255,.22);
    padding:2px 5px;border-radius:2px;background:rgba(53,224,255,.06)}
  .hint .sep{width:1px;height:12px;background:rgba(53,224,255,.14)}
  .status{position:fixed;left:26px;bottom:22px;z-index:15;font-family:var(--mono);font-size:9px;
    letter-spacing:.13em;color:#3f5b6a;line-height:1.9}
  .status b{color:#5c8a9d;font-weight:400}
  .status .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);
    margin-right:6px;vertical-align:middle;box-shadow:0 0 8px var(--accent);animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- 3D labels ---------- */
  .plabel{position:absolute;display:flex;align-items:center;gap:7px;padding:4px 9px 4px 5px;
    background:rgba(6,14,20,.82);border:1px solid rgba(53,224,255,.42);border-radius:2px;
    font-size:10.5px;letter-spacing:.1em;color:#d8f6ff;white-space:nowrap;opacity:0;
    transition:opacity .35s ease;backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(53,224,255,.16),inset 0 0 12px rgba(53,224,255,.05)}
  .plabel.on{opacity:1}
  .plabel i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:#0a1218;
    background:var(--accent);padding:2px 3px;border-radius:1px;letter-spacing:.02em}
  .plabel b{font-weight:400}
  .plabel::after{content:"";position:absolute;left:50%;bottom:-14px;width:1px;height:14px;
    background:linear-gradient(180deg,rgba(53,224,255,.55),transparent)}

  @media (max-width:1180px){
    .panel-left{width:216px}
    .panel-right{width:268px}
    #partList li .en{display:none}
  }
  @media (max-width:900px){
    .panel-left{display:none}
    .panel-right{left:12px;right:12px;top:auto;bottom:62px;width:auto;max-height:40vh}
    .hint-desktop{display:none}
    .hint-mobile{display:flex;bottom:14px;gap:10px;padding:7px 14px}
    .status{display:none}
    .topbar{padding:0 14px;height:70px}
    .brand-txt span{display:none}
    .actions button{padding:6px 9px;font-size:10px}
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="vignette"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">DJI</div>
    <div class="brand-txt">
      <h1>AIR 3S</h1>
      <span>结构拆解 · 三维可视化 / EXPLODED VIEW</span>
    </div>
  </div>
  <div class="actions">
    <button data-act="explode">全部拆解</button>
    <button data-act="reset">复位视角</button>
    <button data-act="rotate">自动旋转</button>
  </div>
</div>

<aside class="panel panel-left">
  <div class="p-head"><span>部件清单</span><em>COMPONENTS</em></div>
  <ul id="partList"></ul>
  <div class="panel-foot"><span>9 MODULES</span><span>CLICK TO EXPLODE</span></div>
</aside>

<aside class="panel panel-right">
  <div class="p-head"><span>部件详情</span><em>SPECIFICATION</em></div>
  <div class="p-body" id="detailBody"></div>
</aside>

<div class="hint hint-desktop" id="hint">
  <div class="h-item"><kbd>拖拽</kbd> 旋转视角</div>
  <div class="sep"></div>
  <div class="h-item"><kbd>滚轮</kbd> 缩放</div>
  <div class="sep"></div>
  <div class="h-item"><kbd>点击</kbd> 拆解部件</div>
  <div class="sep"></div>
  <div class="h-item"><kbd>E</kbd> 全部拆解 <kbd>R</kbd> 复位</div>
</div>
<div class="hint hint-mobile">
  <div class="h-item">单指旋转</div>
  <div class="sep"></div>
  <div class="h-item">双指缩放</div>
  <div class="sep"></div>
  <div class="h-item">点击部件拆解</div>
</div>

<div class="status">
  <div><span class="dot"></span><b>RENDER</b> WEBGL · THREE.JS</div>
  <div><b>PARTS</b> <span id="statParts">09</span> / <b>FPS</b> <span id="statFps">60</span></div>
</div>

<div id="boot">
  <div class="boot-ring"></div>
  <div class="boot-title">DJI AIR 3S</div>
  <div class="boot-bar"><i></i></div>
  <div id="bootMsg">正在构建三维场景 · 请稍候</div>
</div>

<!-- ============ 应用代码（由加载器在选定 CDN 后以模块方式执行） ============ -->
<script id="app-src" type="text/plain">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const ACCENT = 0x35e0ff;
const bootEl = document.getElementById('boot');

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.className = 'label-layer';
host.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050a10, 0.026);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
const HOME_POS = new THREE.Vector3(2.15, 1.82, -4.15);
const HOME_TARGET = new THREE.Vector3(0, -0.02, -0.10);
const HOME_DIR = new THREE.Vector3(0.442, 0.374, -0.854).normalize();

function layoutCamera() {
  const a = window.innerWidth / window.innerHeight;
  const portrait = a < 0.95;
  camera.fov = portrait ? 48 : 36;
  camera.aspect = a;
  camera.updateProjectionMatrix();
  const vFov = (camera.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * a);
  const half = Math.min(vFov, hFov) / 2;
  const d = Math.min(Math.max(1.68 / Math.sin(half) * 1.02, 4.4), 12.2);
  HOME_TARGET.set(0, portrait ? -0.42 : -0.02, -0.10);
  HOME_POS.copy(HOME_TARGET).addScaledVector(HOME_DIR, d);
  camera.position.copy(HOME_POS);
  if (typeof controls !== 'undefined') controls.target.copy(HOME_TARGET);
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.8;
controls.minDistance = 2.4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.54;
controls.minPolarAngle = Math.PI * 0.05;
controls.autoRotateSpeed = 0.85;
layoutCamera();

/* ============================================================
   2. 灯光 / 环境
   ============================================================ */
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
if ('environmentIntensity' in scene) scene.environmentIntensity = 0.30;

const key = new THREE.DirectionalLight(0xfff3e6, 3.0);
key.position.set(5.2, 5.4, -1.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3.4;
key.shadow.camera.right = 3.4;
key.shadow.camera.top = 3.4;
key.shadow.camera.bottom = -3.4;
key.shadow.camera.near = 1;
key.shadow.camera.far = 24;
key.shadow.bias = -0.0011;
key.shadow.radius = 2.2;
scene.add(key);

const rim = new THREE.DirectionalLight(0x6fd8ff, 2.6);
rim.position.set(-4.6, 2.4, 4.4);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xa9c4d6, 0.5);
fill.position.set(-3.0, 0.6, -4.2);
scene.add(fill);

const under = new THREE.DirectionalLight(0xa8dcec, 0.42);
under.position.set(1.5, -2.4, -2.0);
scene.add(under);

scene.add(new THREE.AmbientLight(0x69808f, 0.22));

/* ============================================================
   3. 背景 / 地面 / 粒子
   ============================================================ */
const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
    varying vec3 vP;
    void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    varying vec3 vP;
    void main(){
      float y = normalize(vP).y;
      vec3 c = mix(vec3(0.003,0.006,0.010), vec3(0.010,0.032,0.044), smoothstep(-0.55, 0.02, y));
      c = mix(c, vec3(0.002,0.005,0.009), smoothstep(0.02, 0.9, y));
      float band = exp(-abs(y) * 11.0);
      c += vec3(0.008,0.040,0.055) * band * 0.55;
      gl_FragColor = vec4(c, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(70, 32, 24), bgMat));

const FLOOR_Y = -0.70;

const grid = new THREE.GridHelper(34, 34, 0x1c536a, 0x0c2531);
grid.position.y = FLOOR_Y;
grid.material.transparent = true;
grid.material.opacity = 0.5;
grid.material.depthWrite = false;
scene.add(grid);

function radialTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(53,224,255,0.42)');
  g.addColorStop(0.32, 'rgba(26,110,150,0.17)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const glowDisc = new THREE.Mesh(
  new THREE.PlaneGeometry(6.6, 6.6),
  new THREE.MeshBasicMaterial({
    map: radialTexture(), transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, opacity: 0.7
  })
);
glowDisc.rotation.x = -Math.PI / 2;
glowDisc.position.y = FLOOR_Y + 0.004;
scene.add(glowDisc);

const shadowPlane = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.62 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = FLOOR_Y + 0.002;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

const ringMat = new THREE.MeshBasicMaterial({
  color: 0x2ad8ff, transparent: true, opacity: 0.12, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const radarRing = new THREE.Mesh(new THREE.RingGeometry(2.02, 2.025, 128), ringMat);
radarRing.rotation.x = -Math.PI / 2;
radarRing.position.y = FLOOR_Y + 0.006;
scene.add(radarRing);
const radarRing2 = new THREE.Mesh(new THREE.RingGeometry(2.55, 2.553, 128), ringMat.clone());

const rbox = (w, h, d, r = 0.04, seg = 3) =>
  new RoundedBoxGeometry(w, h, d, seg, Math.min(r, Math.min(w, h, d) / 2 - 0.002));

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  parent.add(m);
  return m;
}

function strut(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

function part(id, name, en, desc, specs) {
  const group = new THREE.Group();
  group.userData.partId = id;
  drone.add(group);
  const p = {
    id, name, en, desc, specs, group,
    nodes: [], meshes: [], t: 0, target: 0, hl: 0, _glow: -1,
    labelEl: null, edges: null
  };
  parts.push(p);
  PART_MAP[id] = p;
  return p;
}

function sub(p, dir = [0, 0, 0], base = [0, 0, 0]) {
  const g = new THREE.Group();
  g.position.set(base[0], base[1], base[2]);
  p.group.add(g);
  p.nodes.push({
    obj: g,
    base: new THREE.Vector3(base[0], base[1], base[2]),
    dir: new THREE.Vector3(dir[0], dir[1], dir[2])
  });
  return g;
}

function buildArm(p, side, front) {
  const g = sub(p, [side * 0.62, 0.08, front ? -0.20 : 0.20]);
  const x0 = side * 0.34, z0 = front ? -0.48 : 0.56;
  const x1 = side * 1.15, z1 = front ? -1.02 : 1.02;
  const dx = x1 - x0, dz = z1 - z0;
  const len = Math.hypot(dx, dz);
  const ang = Math.atan2(-dz, dx);

  // 主臂梁
  const beam = add(g, rbox(len * 0.96, 0.072, 0.105, 0.028, 3), MAT.shell(),
    [(x0 + x1) / 2, 0.015, (z0 + z1) / 2]);
  beam.rotation.y = ang;

  // 根部加强
  const root = add(g, rbox(0.19, 0.092, 0.145, 0.032, 3), MAT.shellLite(),
    [x0 + dx * 0.10, 0.015, z0 + dz * 0.10]);
  root.rotation.y = ang;

  // 臂上装饰槽
  const slot = add(g, new THREE.BoxGeometry(len * 0.46, 0.006, 0.026), MAT.dark(),
    [(x0 + x1) / 2 + dx * 0.03, 0.052, (z0 + z1) / 2 + dz * 0.03]);
  slot.rotation.y = ang;

  // 电机座
  const pod = add(g, rbox(0.26, 0.085, 0.23, 0.04, 4), MAT.shell(),
    [x1, 0.02, z1]);
  pod.rotation.y = ang;

  // 桨叶卡扣
  add(g, new THREE.BoxGeometry(0.026, 0.028, 0.075), MAT.gunmetal(), [x1 - side * 0.075, 0.068, z1]);
}

    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.7, depthWrite: false })
  );
  plate.rotation.x = -Math.PI / 2;
  plate.position.set(0, 0.2178, 0.18);
  g.add(plate);
})();

/* ---------- 6.7 起落架 ---------- */
(function buildGear() {
  const g = sub(GEAR, [0, -0.30, -0.06]);
  [-1, 1].forEach(s => {
    const a = new THREE.Vector3(s * 0.26, -0.13, -0.42);
    const b = new THREE.Vector3(s * 0.32, -0.45, -0.60);
    g.add(strut(a, b, 0.062, MAT.shellLite()));
    const mid = new THREE.Vector3(s * 0.30, -0.29, -0.49);
    g.add(strut(new THREE.Vector3(s * 0.33, -0.16, -0.545), mid, 0.026, MAT.gunmetal()));
    // 脚垫
    add(g, rbox(0.12, 0.05, 0.19, 0.022), MAT.rubber(), [b.x, b.y - 0.014, b.z]);
    add(g, new THREE.SphereGeometry(0.058, 14, 10), MAT.rubber(), [b.x, b.y + 0.014, b.z]);
    // 与机身连接座
    add(g, new THREE.CylinderGeometry(0.042, 0.042, 0.03, 12), MAT.dark(), [s * 0.26, -0.135, -0.42]);
  });
})();

/* ---------- 6.8 感知系统 ---------- */
(function buildSense() {
  const g = sub(SENSE, [0, 0.02, -0.44]);

  add(g, rbox(0.56, 0.10, 0.05, 0.018, 3), MAT.dark(), [0, 0.045, -1.005]);
  [-1, 1].forEach(s => {
    add(g, new THREE.CylinderGeometry(0.038, 0.038, 0.018, 20), MAT.gunmetal(),
      [s * 0.185, 0.045, -1.032], [Math.PI / 2, 0, 0]);
    add(g, new THREE.CylinderGeometry(0.028, 0.028, 0.01, 20), MAT.glass(),
      [s * 0.185, 0.045, -1.040], [Math.PI / 2, 0, 0]);
  });
  add(g, rbox(0.15, 0.045, 0.02, 0.008, 3), MAT.glass(), [0, 0.045, -1.034]);
  add(g, new THREE.BoxGeometry(0.12, 0.005, 0.004),
    new THREE.MeshBasicMaterial({ color: 0x2ad8ff, transparent: true, opacity: 0.5 }),
    [0, 0.045, -1.045]);
})();

/* ============================================================
   7. 后处理：泛光
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.48, 0.55, 0.86
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   8. 收尾：材质隔离 / 标签
   ============================================================ */
const labelIndex = { body: '01', gimbal: '02', armF: '03', armR: '04', motor: '05', prop: '06', battery: '07', gear: '08', sense: '09' };

const LABEL_POS = {
  body: [0, 0.42, 0.05],
  gimbal: [0, -0.56, -1.02],
  armF: [0.80, 0.30, -0.76],
  armR: [0.80, 0.30, 0.80],
  motor: [0, 0.40, 0],
  prop: [0, 0.26, 0],
  battery: [0, 0.30, 0.36],
  gear: [0.42, -0.56, -0.46],
  sense: [0, 0.22, -1.00]
};

parts.forEach(p => {
  p.group.traverse(o => {
    if (o.isMesh) {
      o.userData.partId = p.id;
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material && o.material.clone) o.material = o.material.clone();
      p.meshes.push(o);
    }
  });

  const el = document.createElement('div');
  el.className = 'plabel';
  el.innerHTML = '<i>' + labelIndex[p.id] + '</i><b>' + p.name + '</b>';
  const obj = new CSS2DObject(el);
  const lp = LABEL_POS[p.id] || [0, 0.5, 0];
  obj.position.set(lp[0], lp[1], lp[2]);
  obj.center.set(0.5, (p.id === 'gimbal' || p.id === 'gear') ? 0 : 1);
  p.nodes[0].obj.add(obj);
  p.labelEl = el;
});

/* ---------- 拆解引导虚线 ---------- */
parts.forEach(p => {
  p.guides = [];
  p.nodes.forEach(n => {
    if (n.dir.lengthSq() < 0.0001) return;
    const a = n.base.clone();
    const b = n.base.clone().add(n.dir);
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    const mat = new THREE.LineDashedMaterial({
      color: 0x2ad8ff, dashSize: 0.045, gapSize: 0.05,
      transparent: true, opacity: 0, depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    line.computeLineDistances();
    line.raycast = function () {};
    drone.add(line);
    p.guides.push(line);
  });
});

/* ============================================================
   9. UI
   ============================================================ */
const listEl = document.getElementById('partList');
const detailEl = document.getElementById('detailBody');
const statParts = document.getElementById('statParts');

parts.forEach((p) => {
  const li = document.createElement('li');
  li.dataset.id = p.id;
  li.innerHTML = '<span class="idx">' + labelIndex[p.id] + '</span>' +
    '<span><span class="nm">' + p.name + '</span><span class="en">' + p.en + '</span></span>';
  li.addEventListener('click', () => togglePart(p));
  li.addEventListener('mouseenter', () => { hovered = p; });
  li.addEventListener('mouseleave', () => { if (hovered === p) hovered = null; });
  p.li = li;
  listEl.appendChild(li);
});

function renderDetail(p) {
  if (!p) {
    detailEl.innerHTML = `
      <div class="overview">
        <p class="ov-lead">DJI Air 3S 是 Air 系列首款搭载 1 英寸 CMOS 双摄系统与前置激光雷达的航拍无人机，兼顾画质、续航与全向感知能力。</p>
        <div class="ov-grid">
          <div class="ov-cell"><b>724 g</b><span>起飞重量</span></div>
          <div class="ov-cell"><b>45 min</b><span>最长飞行时间</span></div>
          <div class="ov-cell"><b>双摄</b><span>广角 + 中长焦</span></div>
          <div class="ov-cell"><b>20 km</b><span>O4 图传距离</span></div>
        </div>
        <p class="ov-tip">点击机身任意部件，或从左侧清单选择，即可展开<em>结构拆解</em>动画并查看该部件的技术参数。</p>
      </div>`;
    return;
  }
  detailEl.innerHTML = `
    <div class="d-top">
      <span class="d-index">${labelIndex[p.id]}</span>
      <div><h2>${p.name}</h2><p class="d-en">${p.en}</p></div>
    </div>
    <p class="d-desc">${p.desc}</p>
    <div class="d-specs">
      ${p.specs.map(s => `<div class="spec-row"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}
    </div>
    <button class="d-btn" id="dBtn">${p.target > 0.5 ? '收起该部件' : '拆解该部件'}</button>
  `;
  document.getElementById('dBtn').addEventListener('click', () => togglePart(p));
}

let selected = null;
let hovered = null;

function syncUI() {
  parts.forEach(p => p.li.classList.toggle('active', p === selected));
  renderDetail(selected);
  statParts.textContent = String(parts.length).padStart(2, '0');
}

function selectPart(p) {
  selected = p;
  if (p) p.target = 1;
  syncUI();
}

function togglePart(p) {
  if (selected === p) {
    if (p.target > 0.5) {
      p.target = 0;
      selected = null;
    } else {
      p.target = 1;
    }
  } else {
    selected = p;
    p.target = 1;
  }
  syncUI();
}

function clearSelection() {
  selected = null;
  syncUI();
}

/* ---------- 按钮 ---------- */
const btnExplode = document.querySelector('[data-act="explode"]');
const btnReset = document.querySelector('[data-act="reset"]');
const btnRotate = document.querySelector('[data-act="rotate"]');
let allExploded = false;

function tweenCamera(toPos, toTarget, dur) {
  camTween = {
    t: 0, dur: dur || 0.9,
    fromP: camera.position.clone(), toP: toPos.clone(),
    fromT: controls.target.clone(), toT: toTarget.clone()
  };
}

function setExplodeAll(v) {
  allExploded = v;
  parts.forEach(p => { p.target = v ? 1 : 0; });
  btnExplode.classList.toggle('on', v);
  if (!v) selected = null;
  if (v) {
    tweenCamera(new THREE.Vector3(4.05, 3.42, -5.25), new THREE.Vector3(0, 0.12, -0.05), 1.0);
  } else if (!camTween) {
    tweenCamera(HOME_POS, HOME_TARGET, 0.9);
  }
  syncUI();
}
btnExplode.addEventListener('click', () => setExplodeAll(!allExploded));

btnReset.addEventListener('click', () => {
  setExplodeAll(false);
  hovered = null;
  selected = null;
  controls.autoRotate = false;
  btnRotate.classList.remove('on');
  tweenCamera(HOME_POS, HOME_TARGET, 0.85);
  syncUI();
});

btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('on', controls.autoRotate);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'e' || e.key === 'E') setExplodeAll(!allExploded);
  if (e.key === 'r' || e.key === 'R') btnReset.click();
  if (e.code === 'Space') { e.preventDefault(); btnRotate.click(); }
});

/* ---------- 拾取 ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pickAt(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(drone.children, true);
  for (let i = 0; i < hits.length; i++) {
    let o = hits[i].object;
    while (o && !o.userData.partId) o = o.parent;
    if (o && o.userData.partId) return PART_MAP[o.userData.partId];
  }
  return null;
}

let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  if (performance.now() - downT > 600) return;
  const p = pickAt(e.clientX, e.clientY);
  if (p) togglePart(p);
  else clearSelection();
});
renderer.domElement.addEventListener('pointermove', (e) => {
  const p = pickAt(e.clientX, e.clientY);
  hovered = p;
  renderer.domElement.style.cursor = p ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('pointerleave', () => { hovered = null; });

const hintEl = document.getElementById('hint');
let hinted = false;
controls.addEventListener('start', () => {
  if (!hinted) { hinted = true; hintEl.classList.add('dim'); }
});

/* ============================================================
   10. 动画
   ============================================================ */
const clock = new THREE.Clock();
let camTween = null;
let introT = 0;
let firstFrame = false;
let fpsAcc = 0, fpsFrames = 0;
const fpsEl = document.getElementById('statFps');

function smooth(t) { return t * t * (3 - 2 * t); }

function ensureEdges(p) {
  if (p.edges) return;
  p.edges = [];
  p.meshes.forEach(m => {
    if (!m.geometry || !m.geometry.attributes.position) return;
    let eg;
    try { eg = new THREE.EdgesGeometry(m.geometry, 34); } catch (e) { return; }
    if (!eg.attributes.position || eg.attributes.position.count === 0) return;
    const line = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({
      color: 0xa8f6ff, transparent: true, opacity: 0, depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    line.raycast = function () {};
    m.add(line);
    p.edges.push(line);
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const et = clock.elapsedTime;

  // 入场：机体自下而上旋转归位
  if (introT < 1) {
    introT = Math.min(1, introT + dt / 1.5);
    const k = 1 - Math.pow(1 - introT, 3);
    drone.position.y = (1 - k) * -1.05;
    drone.rotation.y = (1 - k) * 0.55;
    drone.scale.setScalar(0.9 + 0.1 * k);
  } else {
    drone.rotation.y = 0;
    drone.scale.setScalar(1);
    drone.position.y = Math.sin(et * 0.5) * 0.016;
  }

  if (camTween) {
    camTween.t += dt / camTween.dur;
    const k = smooth(Math.min(camTween.t, 1));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    if (camTween.t >= 1) camTween = null;
  }

  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.t = THREE.MathUtils.damp(p.t, p.target, 4.0, dt);
    if (p.t < 0.0006) p.t = 0;
    const e = smooth(p.t);
    for (let j = 0; j < p.nodes.length; j++) {
      const n = p.nodes[j];
      n.obj.position.copy(n.base).addScaledVector(n.dir, e);
    }

    const targetHl = p === selected ? 1 : (p === hovered ? 0.35 : 0);
    p.hl = THREE.MathUtils.damp(p.hl, targetHl, 9, dt);
    const pulse = 0.78 + 0.22 * Math.sin(et * 3.4);
    const glow = p.hl * (p === selected ? pulse : 1);
    if (Math.abs(glow - p._glow) > 0.003) {
      p._glow = glow;
      for (let k = 0; k < p.meshes.length; k++) {
        const mat = p.meshes[k].material;
        if (mat && mat.emissive) {
          mat.emissive.setHex(0x2ec8e8);
          mat.emissiveIntensity = glow * 0.16;
        }
      }
      if (p.edges) for (let k = 0; k < p.edges.length; k++) p.edges[k].material.opacity = glow * 0.55;
    }
    if (p === selected && !p.edges) ensureEdges(p);

    if (p.guides && p.guides.length) {
      const go = Math.max(0, (p.t - 0.08)) * 0.5;
      for (let k = 0; k < p.guides.length; k++) p.guides[k].material.opacity = go;
    }

    const showLabel = p.t > 0.22 || p === selected;
    if (p._labelOn !== showLabel) {
      p._labelOn = showLabel;
      p.labelEl.classList.toggle('on', showLabel);
    }
  }

  // 螺旋桨旋转
  for (let i = 0; i < PROP.nodes.length; i++) PROP.nodes[i].obj.rotation.y += 2.4 * dt;

  particles.rotation.y += dt * 0.012;
  radarRing.rotation.z += dt * 0.14;
  radarRing2.rotation.z -= dt * 0.19;
  ringMat.opacity = 0.09 + Math.sin(et * 1.3) * 0.035;

  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);

  if (!firstFrame) {
    firstFrame = true;
    setTimeout(() => {
      bootEl.classList.add('gone');
      setTimeout(() => { if (bootEl.parentNode) bootEl.remove(); }, 900);
    }, 220);
  }

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc > 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }
}

let lastPortrait = window.innerWidth / window.innerHeight < 0.95;
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  const portrait = w / h < 0.95;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  labelRenderer.setSize(w, h);
  bloom.resolution.set(w, h);
  if (portrait !== lastPortrait) {
    lastPortrait = portrait;
    layoutCamera();
    camTween = null;
  } else {
    const a = w / h;
    camera.fov = a < 0.95 ? 48 : 36;
    camera.updateProjectionMatrix();
  }
});

/* ---------- 启动 ---------- */
syncUI();
animate();
window.__APP = { scene, camera, controls, parts, PART_MAP, renderer, composer, bloom, THREE };

</script>

<!-- ============ 引擎加载器（多 CDN 兜底） ============ -->
<script>
(function () {
  var CDNS = [
    'https://unpkg.com/three@0.169.0/',
    'https://cdn.staticfile.org/three.js/0.169.0/',
    'https://lib.baomitu.com/three.js/0.169.0/',
    'https://cdn.jsdelivr.net/npm/three@0.169.0/'
  ];
  var bootMsg = document.getElementById('bootMsg');
  var boot = document.getElementById('boot');

  function fail(msg) {
    bootMsg.innerHTML = msg;
    var bar = document.querySelector('.boot-bar');
    if (bar) bar.style.display = 'none';
    var ring = document.querySelector('.boot-ring');
    if (ring) ring.style.animation = 'none';
  }

  function probe(base) {
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 2600);
      fetch(base + 'package.json', { mode: 'cors', cache: 'no-store' })
        .then(function (r) { if (!done) { done = true; clearTimeout(timer); resolve(r.ok); } })
        .catch(function () { if (!done) { done = true; clearTimeout(timer); resolve(false); } });
    });
  }

  async function boot3d() {
    var base = null;
    for (var i = 0; i < CDNS.length; i++) {
      bootMsg.textContent = '正在连接渲染引擎 · ' + CDNS[i].replace('https://', '').split('/')[0];
      var ok = await probe(CDNS[i]);
      if (ok) { base = CDNS[i]; break; }
    }
    if (!base) base = CDNS[0];

    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({
      imports: {
        'three': base + 'build/three.module.js',
        'three/addons/': base + 'examples/jsm/'
      }
    });
    document.head.appendChild(im);

    bootMsg.textContent = '正在生成机体结构 · ' + base.replace('https://', '').split('/')[0];

    var code = document.getElementById('app-src').textContent;
    var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    try {
      await import(url);
    } catch (err) {
      console.error(err);
      fail('三维场景初始化失败<br><span style="color:#7d5560">' + (err && err.message ? err.message : err) + '</span><br>请尝试使用 Chrome / Edge 打开，或通过本地服务器访问');
    }
  }

  window.addEventListener('error', function (e) {
    if (!document.querySelector('#scene canvas')) {
      fail('资源加载异常：' + (e.message || '未知错误'));
    }
  });

  boot3d();

  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('gone')) {
      b.style.pointerEvents = 'none';
      b.style.opacity = '0';
      setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 800);
    }
  }, 15000);
})();
</script>
